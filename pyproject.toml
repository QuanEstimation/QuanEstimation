[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quanestimation"
version = "0.5.0"
description = "A package for quantum parameter estimation."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
    { name = "QuanEstimation Group (Jing Liu et al.)", email = "jing.liu@hainanu.edu.cn" }
]
keywords = ["quanestimation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]
dependencies = [
    "numpy>=1.21",
    "sympy>=1.9",
    "scipy>=1.7",
    "cvxpy>=1.2",
    "juliacall>=0.9.37",
    "more_itertools>=8.12",
    "h5py>=3.6"
]

[project.urls]
Homepage = "https://github.com/QuanEstimation/QuanEstimation"

[project.optional-dependencies]
test = [
    "pytest",
    "coverage",
    "codecov"
]
dev = [
    "bump2version>=0.5.11",
    "wheel>=0.33.6",
    "build",
    "pytest>=8.4.0",
    "coverage>=7.9.0",
    "codecov"    
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["quanestimation*"]

[tool.setuptools.package-data]
quanestimation = ["juliapkg.json"]
